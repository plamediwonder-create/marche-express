<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hors connexion · Marché Express</title>
<meta name="theme-color" content="#0B6B8A">
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;background:linear-gradient(145deg,#0B6B8A,#12A3A0)}
  main{width:100%;max-width:380px;text-align:center}
  img{width:88px;height:88px;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  h1{margin:20px 0 8px;font-size:24px;line-height:1.2}
  p{margin:0 0 24px;opacity:.92;line-height:1.45}
  button{font:inherit;font-weight:800;font-size:16px;width:100%;border:0;border-radius:14px;padding:15px;background:#fff;color:#0B6B8A;cursor:pointer}
  button:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="icon-192.png" alt="Marché Express" width="88" height="88">
  <h1>Vous êtes hors connexion</h1>
  <p>Marché Express a besoin d’internet pour afficher les produits et vos commandes. Vérifiez votre connexion, puis réessayez.</p>
  <button type="button" id="retry">Réessayer</button>
</main>
<script>
  document.getElementById('retry').addEventListener('click', function () { location.href = './'; });
  window.addEventListener('online', function () { location.href = './'; });
</script>
</body>
</html>
