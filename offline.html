<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marché Express</title>
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:var(--space-6) var(--gutter-r) var(--space-6) var(--gutter-l);background:var(--gradient-brand);color:var(--color-on-primary);font-family:var(--font);font-size:var(--text-md);line-height:var(--leading-normal);text-align:center}
main{width:100%;max-width:420px;display:grid;gap:var(--space-4);justify-items:center}
img{width:96px;height:96px;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)}
h1{margin:0;font-size:var(--text-2xl);line-height:var(--leading-tight)}
p{margin:0;opacity:.95}
.spin{margin:0 auto var(--space-3);width:28px;height:28px;border-radius:var(--radius-round);border:3px solid var(--color-on-primary);border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
button{font:inherit;font-weight:var(--weight-bold);min-height:52px;width:100%;border:0;border-radius:var(--radius);background:var(--color-surface);color:var(--color-primary);cursor:pointer;margin-top:var(--space-2)}
button:disabled{opacity:.7;cursor:wait}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
</style>
</head>
<body>
<main>
  <img src="icon-192.png" width="96" height="96" alt="">
  <div id="checking" role="status">
    <div class="spin"></div>
    <h1>Vérification de la connexion…</h1>
  </div>
  <div id="off" hidden>
    <h1>Vous êtes hors connexion</h1>
    <p id="msg">Marché Express a besoin d’internet pour afficher les produits et vos commandes. Vérifiez votre connexion : l’application s’ouvrira toute seule dès qu’elle revient.</p>
    <button id="retry" type="button">Réessayer</button>
  </div>
</main>
<script>
(function(){
  var base=location.pathname.replace(/[^\/]*$/,'');
  var fails=0,busy=false,timer=null;
  function $(id){return document.getElementById(id)}
  function ping(){
    /* le paramètre « probe » oblige le service worker à passer par le réseau : on teste la vraie connexion */
    var ac=window.AbortController?new AbortController():null,t=setTimeout(function(){ac&&ac.abort()},7000);
    return fetch(base+'manifest.json?probe='+Date.now(),{cache:'no-store',signal:ac?ac.signal:undefined})
      .then(function(r){clearTimeout(t);return r.ok||r.status<500},function(){clearTimeout(t);return false});
  }
  function check(manual){
    if(busy)return;busy=true;
    $('retry').disabled=true;
    if(manual){$('checking').hidden=false;$('off').hidden=true}
    ping().then(function(ok){
      busy=false;$('retry').disabled=false;
      if(ok){location.replace(base);return}
      fails++;
      if(fails>=2||manual){
        $('checking').hidden=true;$('off').hidden=false;
        if(manual)$('msg').textContent='Toujours pas de connexion. Nouvel essai automatique dans quelques secondes.';
      }
      schedule();
    });
  }
  function schedule(){clearTimeout(timer);timer=setTimeout(function(){if(!document.hidden)check(false);else schedule()},3500)}
  $('retry').addEventListener('click',function(){check(true)});
  window.addEventListener('online',function(){check(false)});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)check(false)});
  check(false);
})();
</script>
</body>
</html>
